ktor:
  application:
    modules:
      - cloud.mallne.dicentra.areaassist.codex.ApplicationKt.codexModule
  deployment:
    port: "$PORT:8080"
  development: "$DEVELOPMENT:false"

server:
  auto_release_version: "$AUTORELEASEVERSION:true"
  tls_enabled: "$TLSENABLED:true"
  hostname: "$HOSTNAME:"
  info: "$INFO:DiCentra AreaAssist Codex"
  description: "$DESCRIPTION:A discovery for AreaAssist."
  base_locator: "DCAACodex"
  discovery_exclusions: "$DISCOVERY_EXCLUSIONS:"
  cors:
    all: "$CORS_ALL:false"
    hosts: "$CORS_HOSTS:"

data:
  url: "$DATA_URL"
  user: "$DATA_USER"
  password: "$DATA_PASSWORD"
  schema: "$DATA_SCHEMA:codex"
  migrations:
    - "db/migration"
  callbacks:
    - "db/callback"
  auto_create_delta: "$DATA_AUTOCREATEDELTA:false"
  migration_name: "$DATA_MIGRATIONNAME:V0__create.generated"

catalyst:
  enabled: "$CATALYST_ENABLED:true"
  anonymous: "$CATALYST_ANONYMOUS:true"
  max_targets: "$CATALYST_MAX_TARGETS:32"
  max_concurrent_targets: "$CATALYST_MAX_CONCURRENT_TARGETS:4"
  max_request_bytes: "$CATALYST_MAX_REQUEST_BYTES:1048576"
  max_response_bytes: "$CATALYST_MAX_RESPONSE_BYTES:16777216"
  max_aggregate_response_bytes: "$CATALYST_MAX_AGGREGATE_RESPONSE_BYTES:33554432"
  per_target_timeout_millis: "$CATALYST_PER_TARGET_TIMEOUT_MILLIS:15000"
  overall_timeout_millis: "$CATALYST_OVERALL_TIMEOUT_MILLIS:30000"
  allowed_hosts: "$CATALYST_ALLOWED_HOSTS:"
  server_name: "$CATALYST_SERVERNAME:"
  tls_enabled: "$CATALYST_TLSENABLED:true"
  title: "$CATALYST_TITLE:Synapse Catalyst"
  description: "$CATALYST_DESCRIPTION:Make Requests to a stored Service in a single Tenant setup."

preferred_transform: "$PREFERRED_TRANSFORM:Native"

telemetry:
  endpoint: "$OTEL_EXPORTER_OTLP_ENDPOINT:"
  service_name: "$OTEL_SERVICE_NAME:codex"

security:
  enabled: "$SECURITY_ENABLED:false"
  issuer: "$SECURITY_ISSUER:"
  scopes: "$SECURITY_SCOPES:"
  client_id: "$SECURITY_CLIENTID:"
  client_secret: "$SECURITY_CLIENTSECRET:"
  areaassist_client_id: "$SECURITY_AREAASSIST_CLIENTID:"
  areaassist_client_name: "$SECURITY_AREAASSIST_CLIENTNAME:"
  areaassist_account_console: "$SECURITY_AREAASSIST_ACCOUNTCONSOLE:"
  groups:
    user: "$SECURITY_GROUPS_USER:"
    superadmin: "$SECURITY_GROUPS_SUPERADMIN:"
